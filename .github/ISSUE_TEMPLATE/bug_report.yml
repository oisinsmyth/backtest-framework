name: Bug report
description: Something produces a wrong number, raises unexpectedly, or does not run.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you ran, what you got, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: The smallest script or test that shows the problem. Synthetic bars are ideal.
      render: python
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected value
      description: For a wrong number, the value you expected and how you worked it out.
  - type: input
    id: version
    attributes:
      label: Version
      description: Commit SHA or release tag, plus Python and OS.
      placeholder: "v0.1.0, Python 3.12.13, Ubuntu 24.04"
    validations:
      required: true
