# The verification gates, run by a machine that has never seen this repository.
#
# The project's governing claim is that trust is enforced by structure rather than convention
# (PHILOSOPHY.md), and a suite that only ever runs on the author's laptop is convention. This
# workflow is the structure.
#
# WHAT A RUNNER DOES NOT HAVE: most of the bulk data panels. D536 dropped 115 of them (844 MB)
# from the index; D538 brought the two smallest back (6.9 MB, already in history, so no extra
# clone bytes), which took the skips from 136 to 49. 53 skip here (2026-09-17) for
# want of a panel, named individually by the skip reason and
# recoverable from data/data_manifest.json. Every golden master, every property test and the
# vectorbt cross-engine reconciliation run on a clone, because they use synthetic bars or a small
# tracked .csv.
#
# NETWORK: none. The 5 tests marked `live_fetch` are excluded by the `addopts` in pyproject.toml,
# which is D24's cross-cutting gate ("CI runs offline"), not a decision taken here.

name: tests

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The reviewer's first command, kept as its own job so a break in the anchored ledgers is
  # visible in seconds rather than after the full run. 101 ledger-anchored tests, 0.58s locally.
  # The phrasing matters: `tests/unit/test_quoted_counts_are_current.py` scans for exactly
  # "N ledger-anchored tests" and pins N to the live collection count, so this comment cannot
  # drift the way it did between 91 and 101.
  golden:
    name: golden masters
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run pytest -q tests/golden

  # ruff at the rules named in pyproject (E4/E7/E9/F -- errors, not style), and mypy over the
  # library. Both are pinned in the dev group rather than fetched latest, so the gate cannot
  # widen or narrow without a lockfile diff; `uv sync --locked` is what makes that true here.
  lint:
    name: lint and types
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check src tests
      - run: uv run mypy

  # The two checks that read committed state rather than behaviour, and answer in seconds: every
  # relative link in every tracked document resolves, and no bulk data panel has changed under a
  # published result. D536 named the manifest verify as the thing that keeps the repack honest;
  # this is where it becomes something other than a command somebody has to remember.
  docs:
    name: docs and data integrity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run python scripts/check_doc_links.py
      # The README's inventory block, recomputed from `git ls-files`. Also asserted by
      # tests/unit/test_readme_counts_are_current.py in the suite job; it is here too because a
      # stale count should redden in seconds, not after the full run.
      - run: uv run python scripts/build_readme_counts.py --check
      # The twelve SVGs in docs/figures/, regenerated from their artifacts and compared byte for
      # byte. A figure is the one artifact here that gets quoted and never re-derived, so it is
      # also the one most worth catching stale.
      - run: uv run python scripts/figures/build_all.py --check
      # A clone has only the two panels D538 re-tracked, so almost every entry is "missing" and only
      # a CHANGED file is an error -- which is exactly the condition worth failing on. The two that
      # ARE present get hashed, which is a stronger check than the absent ones get.
      - run: uv run python scripts/build_data_manifest.py --verify

  suite:
    name: full suite
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --locked
      # -rs so the skipped panel-dependent tests are listed by name in the log. A silent skip
      # is how a suite quietly stops testing anything; if the count climbs, it should be read.
      - run: uv run pytest -q -rs
