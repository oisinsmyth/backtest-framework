name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check src tests examples scripts
      - name: Type check
        run: uv run mypy
      - name: Tests
        run: uv run pytest -q
      - name: Examples
        run: |
          uv run python examples/pairs_backtest.py
          uv run python examples/cost_sweep.py
          uv run python examples/deflated_sharpe.py
