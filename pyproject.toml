[project]
name = "backtest-framework"
version = "0.1.0"
description = "Lego-brick-modular quant backtesting framework — see PHILOSOPHY.md"
readme = "README.md"
authors = [
    { name = "Oisin Smyth", email = "oisin.smyth132@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.4.6",
    "pandas>=3.0.3",
    "yfinance>=1.5.1",
]

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "hypothesis>=6.156.6",
    "pytest>=9.1.1",
    "quantstats>=0.0.81",
    "statsmodels>=0.14.6",
    "vectorbt>=1.1.0",
]
ibkr = [
    "ib-async>=2.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live_fetch: hits a real network data source; excluded from default runs (D24 cross-cutting gate: CI runs offline). Run explicitly with `pytest -m live_fetch`.",
]
addopts = "-m \"not live_fetch\""
