[project]
name = "backtest-framework"
version = "0.1.0"
description = "Lego-brick-modular quant backtesting framework — see PHILOSOPHY.md"
readme = "README.md"
license = "MIT"
# NOTICE ships with the wheel too: LICENSE points at it for the scope of the grant, and a
# distribution carrying the pointer without the file would be worse than carrying neither.
license-files = ["LICENSE", "NOTICE"]
authors = [
    { name = "Oisin Smyth", email = "oisin.smyth132@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.4.6",
    "pandas>=3.0.3",
    "yfinance>=1.5.1",
]

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "hypothesis>=6.156.6",
    # ruff and mypy are pinned here rather than run with `uv run --with`, so the gate cannot
    # change without a lockfile diff. D537 is a record of exactly that failure: hypothesis
    # altered its example generation under a floor constraint and a claim silently stopped
    # being true. A linter is the same shape of dependency.
    "mypy>=1.18.2",
    "pytest>=9.1.1",
    "quantstats>=0.0.81",
    "ruff>=0.14.1",
    "statsmodels>=0.14.6",
    "vectorbt>=1.1.0",
]
ibkr = [
    "ib-async>=2.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live_fetch: hits a real network data source; excluded from default runs (D24 cross-cutting gate: CI runs offline). Run explicitly with `pytest -m live_fetch`.",
]
addopts = "-m \"not live_fetch\""
# pytest's default is ["test_*.py", "*_test.py"]. Every one of the 158 tracked tests uses
# test_*.py; the second pattern matches no test here and seven tracked .py files that are NOT
# tests, one of which fetches from SEC and writes a relative path AT IMPORT (D546). Narrowed
# so pytest cannot import them. tests/unit/test_nothing_outside_tests_is_collectable.py reads
# this value back and fails if it is widened or removed.
python_files = ["test_*.py"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
# SELECTED EXPLICITLY, AND THE REASON IS A MEASUREMENT. The plan for this gate said "leave
# `select` unset and take ruff's default ruleset, which is E4/E7/E9/F" -- 26 findings across src
# and tests, 22 auto-fixable. Installing the pinned ruff and running it with no `select` produced
# 553. "The default ruleset" is not a fixed thing: it travels with the tool version, so an
# unpinned-by-omission ruleset is a gate that widens on upgrade without a diff. That is the same
# failure D537 records for hypothesis, arriving from a different direction on the same day.
#
# So the gate names its rules. E4 imports, E7 statements, E9 syntax/IO errors, F pyflakes --
# real errors rather than style opinions. Widening it is a separate decision with its own diff.
select = ["E4", "E7", "E9", "F"]

# `scripts/` JOINS THE GATE AT A NARROWER RULE SET, AND THE NARROWING IS MEASURED (D543).
#
# 603 runners -- the bulk of the Python here and the source of every published number -- were
# linted by nothing. At the rules above they report 7,423, of which E702 (statements separated
# by semicolons) is 5,763: 78%, and a deliberate house style in a research runner. The rest:
# F541 773, E741 276, E731 220, F841 163, E401 84, F401 80, E701 47, E402 10, F821 3, E712 3,
# F601 1. Ignoring the five below leaves EXACTLY 4, and all four were real enough to read:
# one latent closure over a `del`eted name, one ruff false positive, one duplicate dict key.
#
# F841 and F401 are the only two ignores that cost anything, and they are ignored rather than
# fixed BECAUSE THESE FILES ARE EVIDENCE. 163 unused locals across 120 files and 80 unused
# imports across 76: editing a frozen runner that produced a published number, for tidiness, is
# a worse trade than the finding is worth. Two F841s were read before deciding -- a
# comprehension used for its side effects, and an abandoned diagnostic -- and both were
# vestigial rather than a dropped computation. Two of 163 is not a survey, and D543 says so.
#
# `mypy` deliberately does NOT follow: 1,048 errors in 262 of 601 files.
[tool.ruff.lint.per-file-ignores]
"scripts/**" = ["E4", "E7", "F401", "F541", "F841"]

[tool.mypy]
# `src` only. The library is what the project claims; `tests` carries 42 findings (mostly untyped
# helper bodies) and cleaning them is not this gate's job. Stated here rather than left to be
# inferred from a passing run.
files = ["src"]

# Scoped rather than a global ignore_missing_imports, so the config names exactly which two
# third-party packages ship no type information instead of silencing the whole class.
[[tool.mypy.overrides]]
module = ["yfinance.*", "pandas.*"]
ignore_missing_imports = true
