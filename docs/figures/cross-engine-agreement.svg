<title id="t-cross-engine-agreement">Our simulator and vectorbt agree to 1e-12 and on every one of 1,370 trades</title>
<desc id="d-cross-engine-agreement">Two panels. The first is a log axis of per-bar relative divergence between our equity curve and vectorbt's on 2,515 XLE bars: the worst is 1.30e-12, which is 3.8 decades above double precision and 5.9 decades below the 1e-6 tolerance. The second is one column per bar showing that both engines re-sized on the same 1,370 bars, with an empty difference row. Scope: one instrument, long-flat, proportional fees only.</desc>
